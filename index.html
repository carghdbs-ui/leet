<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LEET 추리논증 랜덤 모의고사</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html{background:#888;}
body{font-family:'Malgun Gothic','맑은 고딕',sans-serif;color:#1a1a1a;background:#888;min-height:100vh;}
.ctrl{position:fixed;top:0;left:0;right:0;z-index:500;background:#1a1a1a;display:flex;align-items:center;gap:10px;padding:0 16px;height:48px;}
.ctrl-title{color:#fff;font-size:14px;font-weight:800;letter-spacing:-0.3px;margin-right:4px;}
.ctrl-badge{background:#fff;color:#1a1a1a;font-size:10px;font-weight:800;padding:3px 9px;letter-spacing:1px;white-space:nowrap;}
.ctrl-spacer{flex:1;}
.ctrl-btn{background:transparent;border:1px solid rgba(255,255,255,.4);color:#fff;font-size:12px;font-weight:700;padding:6px 14px;cursor:pointer;letter-spacing:0.3px;white-space:nowrap;}
.ctrl-btn:hover{background:rgba(255,255,255,.15);}
.ctrl-btn.primary{background:#fff;color:#1a1a1a;border-color:#fff;}
.ctrl-btn.primary:hover{background:#ddd;}
.home-overlay{position:fixed;inset:0;z-index:400;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;padding:16px;}
.home-card{background:#fff;border:2px solid #1a1a1a;padding:32px 28px;width:100%;max-width:480px;}
.home-card h1{font-size:32px;font-weight:900;letter-spacing:-1.5px;margin-bottom:6px;}
.home-card .sub{font-size:13px;color:#666;line-height:1.6;margin-bottom:20px;}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:22px;}
.tag{font-size:11px;border:1.5px solid #1a1a1a;padding:3px 9px;font-weight:700;}
.cfg{width:100%;border-collapse:collapse;margin-bottom:22px;}
.cfg td{padding:9px 0;border-bottom:1px solid #eee;font-size:13px;}
.cfg td:first-child{color:#777;width:80px;}
.cfg select{width:100%;font-size:13px;padding:6px 8px;border:1px solid #bbb;background:#fff;border-radius:0;appearance:none;}
.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:20px;}
.sbox{background:#f5f5f2;border:1px solid #e0e0d8;padding:12px 8px;text-align:center;}
.sbox .sn{font-size:24px;font-weight:900;}
.sbox .sl{font-size:10px;color:#999;margin-top:3px;}
.btn-gen{width:100%;background:#1a1a1a;color:#fff;border:none;padding:15px;font-size:16px;font-weight:800;cursor:pointer;letter-spacing:0.5px;}
.btn-gen:hover{background:#333;}
.loading{position:fixed;inset:0;z-index:600;background:#1a1a1a;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;}
.loading p{color:#fff;font-size:15px;font-weight:700;}
.loading-bar-wrap{width:240px;height:4px;background:rgba(255,255,255,.2);border-radius:2px;}
.loading-bar{height:100%;background:#fff;border-radius:2px;transition:width .3s;}
.paper-wrap{padding-top:48px;max-width:1240px;margin:0 auto;padding-left:12px;padding-right:12px;padding-bottom:40px;}
.sheet{background:#fff;display:flex;margin-bottom:3px;border:1px solid #aaa;position:relative;}
.q-col{flex:1;min-width:0;overflow:hidden;}
.q-col:first-child{border-right:1px solid #ccc;}
.q-col img{width:100%;height:auto;display:block;image-rendering:-webkit-optimize-contrast;image-rendering:crisp-edges;}
.q-src{position:absolute;font-size:9px;font-weight:700;background:rgba(26,26,26,0.75);color:#fff;padding:2px 6px;letter-spacing:0.5px;pointer-events:none;z-index:10;}
.q-src.left{top:4px;left:4px;}
.q-src.right{top:4px;right:4px;}
.exam-header{background:#fff;border:1px solid #aaa;border-bottom:3px solid #1a1a1a;padding:16px 20px;display:flex;align-items:center;justify-content:space-between;margin-bottom:3px;}
.eh-left h2{font-size:20px;font-weight:900;letter-spacing:-0.5px;}
.eh-left p{font-size:12px;color:#888;margin-top:3px;}
.eh-right .round-num{font-size:32px;font-weight:900;letter-spacing:-1px;}
.eh-right .round-sub{font-size:11px;color:#888;}
.source-chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;}
.chip{font-size:10px;font-weight:700;padding:3px 8px;letter-spacing:0.3px;}
.chip-2022{background:#e8f0fe;color:#1a56db;}
.chip-2025{background:#fef3c7;color:#92400e;}
.chip-2026{background:#ecfdf5;color:#065f46;}
@media print{
  .ctrl,.home-overlay,.loading{display:none!important;}
  body{background:#fff;}
  .paper-wrap{padding-top:0;padding-left:0;padding-right:0;max-width:100%;}
  .sheet{border:none;margin-bottom:0;}
  .sheet:nth-child(even){page-break-after:always;}
  .q-src{display:none;}
}
@media(max-width:600px){
  .sheet{flex-direction:column;}
  .q-col:first-child{border-right:none;border-bottom:1px solid #ccc;}
}
</style>
</head>
<body>

<!-- Loading screen -->
<div class="loading" id="loadingScreen">
  <p id="loadingMsg">이미지 데이터 로딩 중...</p>
  <div class="loading-bar-wrap"><div class="loading-bar" id="loadingBar" style="width:0%"></div></div>
</div>

<div class="ctrl">
  <span class="ctrl-title">LEET 추리논증</span>
  <span class="ctrl-badge" id="roundBadge" style="display:none"></span>
  <span class="ctrl-spacer"></span>
  <button class="ctrl-btn" id="btnShuffle" onclick="generate()" style="display:none">🔀 새 모의고사</button>
  <button class="ctrl-btn" id="btnPrint" onclick="window.print()" style="display:none">🖨 인쇄</button>
  <button class="ctrl-btn primary" onclick="showHome()">설정</button>
</div>

<div class="home-overlay" id="homeOverlay" style="display:none">
  <div class="home-card">
    <div class="stats-row">
      <div class="sbox"><div class="sn" id="hRound">0</div><div class="sl">생성 횟수</div></div>
      <div class="sbox"><div class="sn">120</div><div class="sl">전체 문항</div></div>
      <div class="sbox"><div class="sn">40</div><div class="sl">문제/회차</div></div>
    </div>
    <h1>모의고사 생성</h1>
    <p class="sub">1번~40번 각 번호마다 세 시험지 중 하나를 랜덤으로 뽑아<br>실전과 동일한 40문항 시험지를 만들어 드립니다.</p>
    <div class="tags">
      <span class="tag">2022학년도 홀수형</span>
      <span class="tag">2025학년도 홀수형</span>
      <span class="tag">2026학년도 홀수형</span>
    </div>
    <table class="cfg">
      <tr><td>혼합 방식</td><td>
        <select id="cfgMode">
          <option value="random" selected>완전 랜덤 (번호별 연도 무작위)</option>
          <option value="block">균등 혼합 (각 연도 균등 추출)</option>
          <option value="2022">2022학년도 전체</option>
          <option value="2025">2025학년도 전체</option>
          <option value="2026">2026학년도 전체</option>
        </select>
      </td></tr>
    </table>
    <button class="btn-gen" onclick="generate()">시험지 생성 →</button>
  </div>
</div>

<div class="paper-wrap" id="paperWrap" style="display:none"></div>

<script src="data.js" onload="onDataLoaded()"></script>
<script>
let roundCount = parseInt(localStorage.getItem('leet_rounds')||'0');
const YEARS = ["2022","2025","2026"];

function onDataLoaded(){
  document.getElementById('loadingBar').style.width='100%';
  document.getElementById('loadingMsg').textContent='완료!';
  setTimeout(()=>{
    document.getElementById('loadingScreen').style.display='none';
    showHome();
  }, 400);
}

// Fallback if script already loaded
window.addEventListener('load', ()=>{
  if(typeof IMGS !== 'undefined') onDataLoaded();
});

function showHome(){
  document.getElementById('hRound').textContent=roundCount;
  document.getElementById('homeOverlay').style.display='flex';
}
function hideHome(){ document.getElementById('homeOverlay').style.display='none'; }

function pickYears(mode){
  if(mode==='2022') return Array(40).fill('2022');
  if(mode==='2025') return Array(40).fill('2025');
  if(mode==='2026') return Array(40).fill('2026');
  if(mode==='block'){
    let pool=[];
    [{y:'2022',n:14},{y:'2025',n:13},{y:'2026',n:13}].forEach(({y,n})=>{
      for(let i=0;i<n;i++) pool.push(y);
    });
    for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]];}
    return pool;
  }
  return Array.from({length:40},()=>YEARS[Math.floor(Math.random()*3)]);
}

function generate(){
  hideHome();
  const mode=document.getElementById('cfgMode').value;
  const yearPlan=pickYears(mode);
  roundCount++;
  localStorage.setItem('leet_rounds',roundCount);
  const cnt={'2022':0,'2025':0,'2026':0};
  yearPlan.forEach(y=>cnt[y]++);
  let chipsH=YEARS.filter(y=>cnt[y]>0).map(y=>`<span class="chip chip-${y}">${y}학년도 ${cnt[y]}문항</span>`).join('');
  let html=`<div class="exam-header">
    <div class="eh-left"><h2>추리논증 랜덤 모의고사</h2><p>총 40문항 · 홀수형 기반</p><div class="source-chips">${chipsH}</div></div>
    <div class="eh-right"><div class="round-num">제 ${roundCount} 회</div><div class="round-sub">LEET 추리논증</div></div>
  </div>`;
  for(let pg=0;pg<20;pg++){
    const lN=pg*2+1,rN=pg*2+2,lY=yearPlan[pg*2],rY=yearPlan[pg*2+1];
    html+=`<div class="sheet">
      <div class="q-col"><img src="${IMGS[lY+'_'+lN]}" alt="${lY}년 ${lN}번" loading="lazy"></div>
      <div class="q-col"><img src="${IMGS[rY+'_'+rN]}" alt="${rY}년 ${rN}번" loading="lazy"></div>
      <span class="q-src left">${lY}·${lN}번</span>
      <span class="q-src right">${rY}·${rN}번</span>
    </div>`;
  }
  document.getElementById('paperWrap').innerHTML=html;
  document.getElementById('paperWrap').style.display='block';
  document.getElementById('roundBadge').textContent='제 '+roundCount+' 회';
  document.getElementById('roundBadge').style.display='';
  document.getElementById('btnShuffle').style.display='';
  document.getElementById('btnPrint').style.display='';
  window.scrollTo({top:0,behavior:'smooth'});
}
</script>
</body>
</html>
