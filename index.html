<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=900, initial-scale=0.5">
<title>LEET 추리논증 랜덤 모의고사</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{background:#777;min-height:100vh;font-family:'Malgun Gothic','맑은 고딕',sans-serif;color:#1a1a1a;}

.ctrl{
  position:fixed;top:0;left:0;right:0;z-index:500;
  background:#1a1a1a;display:flex;align-items:center;
  gap:8px;padding:0 12px;height:44px;
}
.ctrl-title{color:#fff;font-size:13px;font-weight:800;white-space:nowrap;}
.ctrl-badge{background:#fff;color:#1a1a1a;font-size:9px;font-weight:800;padding:2px 7px;letter-spacing:1px;white-space:nowrap;}
.ctrl-spacer{flex:1;}
.ctrl-btn{background:transparent;border:1px solid rgba(255,255,255,.5);color:#fff;font-size:11px;font-weight:700;padding:5px 10px;cursor:pointer;white-space:nowrap;}
.ctrl-btn:hover{background:rgba(255,255,255,.15);}
.ctrl-btn.primary{background:#fff;color:#1a1a1a;border-color:#fff;}

.home-overlay{position:fixed;inset:0;z-index:400;background:rgba(0,0,0,.8);display:flex;align-items:center;justify-content:center;padding:16px;}
.home-card{background:#fff;border:2px solid #1a1a1a;padding:28px 24px;width:100%;max-width:460px;}
.home-card h1{font-size:28px;font-weight:900;letter-spacing:-1px;margin-bottom:6px;}
.home-card .sub{font-size:13px;color:#666;line-height:1.6;margin-bottom:18px;}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px;}
.tag{font-size:11px;border:1.5px solid #1a1a1a;padding:3px 8px;font-weight:700;}
.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:18px;}
.sbox{background:#f5f5f2;border:1px solid #e0e0d8;padding:10px 6px;text-align:center;}
.sbox .sn{font-size:22px;font-weight:900;}
.sbox .sl{font-size:10px;color:#999;margin-top:2px;}
.cfg{width:100%;border-collapse:collapse;margin-bottom:20px;}
.cfg td{padding:9px 0;border-bottom:1px solid #eee;font-size:13px;}
.cfg td:first-child{color:#777;width:76px;font-size:12px;}
.cfg select{width:100%;font-size:13px;padding:6px 8px;border:1px solid #bbb;background:#fff;border-radius:0;appearance:none;}
.btn-gen{width:100%;background:#1a1a1a;color:#fff;border:none;padding:14px;font-size:15px;font-weight:800;cursor:pointer;}
.btn-gen:hover{background:#333;}

.loading{position:fixed;inset:0;z-index:600;background:#1a1a1a;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;}
.loading p{color:#fff;font-size:14px;font-weight:700;}
.loading-bar-wrap{width:200px;height:3px;background:rgba(255,255,255,.2);}
.loading-bar{height:100%;background:#fff;transition:width .3s;}

/* ── PAPER: fixed 900px wide, centered ── */
.paper-wrap{
  padding-top:44px;
  width:900px;
  margin:0 auto;
  padding-left:8px;
  padding-right:8px;
  padding-bottom:40px;
}

.exam-header{
  background:#fff;border:1px solid #999;border-bottom:3px solid #1a1a1a;
  padding:14px 16px;display:flex;align-items:center;justify-content:space-between;
  margin-bottom:2px;
}
.eh-left h2{font-size:17px;font-weight:900;}
.eh-left p{font-size:11px;color:#888;margin-top:2px;}
.eh-right .round-num{font-size:28px;font-weight:900;text-align:right;}
.eh-right .round-sub{font-size:10px;color:#888;text-align:right;}
.source-chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px;}
.chip{font-size:10px;font-weight:700;padding:2px 7px;}
.chip-2022{background:#e8f0fe;color:#1a56db;}
.chip-2025{background:#fef3c7;color:#92400e;}
.chip-2026{background:#ecfdf5;color:#065f46;}

/* 2단 고정 레이아웃 */
.sheet{
  background:#fff;
  display:flex;
  flex-direction:row;
  flex-wrap:nowrap;
  width:884px; /* 900 - 8px*2 padding */
  margin-bottom:2px;
  border:1px solid #999;
  position:relative;
}
.q-col{
  flex:0 0 50%;
  width:50%;
  min-width:0;
  overflow:hidden;
}
.q-col:first-child{border-right:1px solid #bbb;}
.q-col img{
  width:100%;
  height:auto;
  display:block;
  image-rendering:-webkit-optimize-contrast;
  image-rendering:crisp-edges;
}
.q-src{
  position:absolute;font-size:8px;font-weight:700;
  background:rgba(26,26,26,.8);color:#fff;
  padding:2px 5px;pointer-events:none;z-index:10;
}
.q-src.left{top:3px;left:3px;}
.q-src.right{top:3px;right:3px;}

@media print{
  .ctrl,.home-overlay,.loading{display:none!important;}
  body,html{background:#fff;}
  .paper-wrap{padding-top:0;width:100%;}
  .sheet{width:100%;border:none;margin:0;page-break-inside:avoid;}
  .sheet:nth-child(even){page-break-after:always;}
  .q-src{display:none;}
  .exam-header{border:none;}
}
</style>
</head>
<body>

<div class="loading" id="loadingScreen">
  <p id="loadingMsg">이미지 로딩 중...</p>
  <div class="loading-bar-wrap"><div class="loading-bar" id="loadingBar" style="width:5%"></div></div>
</div>

<div class="ctrl">
  <span class="ctrl-title">LEET 추리논증</span>
  <span class="ctrl-badge" id="roundBadge" style="display:none"></span>
  <span class="ctrl-spacer"></span>
  <button class="ctrl-btn" id="btnShuffle" onclick="generate()" style="display:none">🔀 새 모의고사</button>
  <button class="ctrl-btn" id="btnPrint" onclick="window.print()" style="display:none">🖨 인쇄</button>
  <button class="ctrl-btn primary" onclick="showHome()">설정</button>
</div>

<div class="home-overlay" id="homeOverlay" style="display:none">
  <div class="home-card">
    <div class="stats-row">
      <div class="sbox"><div class="sn" id="hRound">0</div><div class="sl">생성 횟수</div></div>
      <div class="sbox"><div class="sn">120</div><div class="sl">전체 문항</div></div>
      <div class="sbox"><div class="sn">40</div><div class="sl">문제/회차</div></div>
    </div>
    <h1>모의고사 생성</h1>
    <p class="sub">1번~40번 각 번호마다 세 시험지 중 하나를 랜덤으로 뽑아 실전과 동일한 40문항 시험지를 만들어 드립니다.</p>
    <div class="tags">
      <span class="tag">2022학년도 홀수형</span>
      <span class="tag">2025학년도 홀수형</span>
      <span class="tag">2026학년도 홀수형</span>
    </div>
    <table class="cfg">
      <tr><td>혼합 방식</td><td>
        <select id="cfgMode">
          <option value="random" selected>완전 랜덤</option>
          <option value="block">균등 혼합 (각 연도 균등)</option>
          <option value="2022">2022학년도 전체</option>
          <option value="2025">2025학년도 전체</option>
          <option value="2026">2026학년도 전체</option>
        </select>
      </td></tr>
    </table>
    <button class="btn-gen" onclick="generate()">시험지 생성 →</button>
  </div>
</div>

<div class="paper-wrap" id="paperWrap" style="display:none">
  <div id="paperInner"></div>
</div>

<script src="data.js" onload="onDataLoaded()"></script>
<script>
const YEARS=["2022","2025","2026"];
let roundCount=parseInt(localStorage.getItem('leet_rounds')||'0');

function onDataLoaded(){
  document.getElementById('loadingBar').style.width='100%';
  document.getElementById('loadingMsg').textContent='준비 완료!';
  setTimeout(()=>{
    document.getElementById('loadingScreen').style.display='none';
    showHome();
  },350);
}
window.addEventListener('load',()=>{ if(typeof IMGS!=='undefined') onDataLoaded(); });

function showHome(){
  document.getElementById('hRound').textContent=roundCount;
  document.getElementById('homeOverlay').style.display='flex';
}
function hideHome(){ document.getElementById('homeOverlay').style.display='none'; }

function pickYears(mode){
  if(['2022','2025','2026'].includes(mode)) return Array(40).fill(mode);
  if(mode==='block'){
    let pool=[];
    [{y:'2022',n:14},{y:'2025',n:13},{y:'2026',n:13}].forEach(({y,n})=>{
      for(let i=0;i<n;i++) pool.push(y);
    });
    for(let i=pool.length-1;i>0;i--){
      const j=Math.floor(Math.random()*(i+1));
      [pool[i],pool[j]]=[pool[j],pool[i]];
    }
    return pool;
  }
  return Array.from({length:40},()=>YEARS[Math.floor(Math.random()*3)]);
}

function generate(){
  hideHome();
  const mode=document.getElementById('cfgMode').value;
  const yp=pickYears(mode);
  roundCount++;
  localStorage.setItem('leet_rounds',roundCount);
  const cnt={'2022':0,'2025':0,'2026':0};
  yp.forEach(y=>cnt[y]++);
  const chipsH=YEARS.filter(y=>cnt[y]>0)
    .map(y=>`<span class="chip chip-${y}">${y}학년도 ${cnt[y]}문항</span>`).join('');

  let html=`<div class="exam-header">
    <div class="eh-left">
      <h2>추리논증 랜덤 모의고사</h2>
      <p>총 40문항 · 홀수형 기반</p>
      <div class="source-chips">${chipsH}</div>
    </div>
    <div class="eh-right">
      <div class="round-num">제 ${roundCount} 회</div>
      <div class="round-sub">LEET 추리논증</div>
    </div>
  </div>`;

  for(let pg=0;pg<20;pg++){
    const lN=pg*2+1,rN=pg*2+2,lY=yp[pg*2],rY=yp[pg*2+1];
    html+=`<div class="sheet">
      <div class="q-col"><img src="${IMGS[lY+'_'+lN]}" alt="${lY}년 ${lN}번" loading="lazy"></div>
      <div class="q-col"><img src="${IMGS[rY+'_'+rN]}" alt="${rY}년 ${rN}번" loading="lazy"></div>
      <span class="q-src left">${lY}·${lN}번</span>
      <span class="q-src right">${rY}·${rN}번</span>
    </div>`;
  }

  document.getElementById('paperInner').innerHTML=html;
  document.getElementById('paperWrap').style.display='block';
  document.getElementById('roundBadge').textContent='제 '+roundCount+' 회';
  document.getElementById('roundBadge').style.display='';
  document.getElementById('btnShuffle').style.display='';
  document.getElementById('btnPrint').style.display='';
  window.scrollTo({top:0,behavior:'smooth'});
}
</script>
</body>
</html>
